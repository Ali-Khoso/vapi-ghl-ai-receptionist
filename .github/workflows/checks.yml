name: Offline repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate template and synthetic contact body
        run: python scripts/validate.py --payload examples/contact-payload.json
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check repository integrity
        run: python scripts/check_repository.py
      - name: Check whitespace
        run: git show --format= --check HEAD
